name: Linux release

# Builds the AppImage + .deb on Ubuntu (sharp and ffmpeg-static ship
# per-platform binaries, so this can't be cross-built from macOS) and
# attaches them to the GitHub release for the pushed tag. A manual run only
# builds and uploads the binaries as a workflow artifact, for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build:linux

      # Copies with the version stripped out, so a website's download button
      # can link to a URL that never changes:
      # /releases/latest/download/vita-theme-creator-x86_64.AppImage
      #
      # The AppImage is also repacked with appimagetool, which electron-builder
      # can't do itself. Repacking embeds update information (so AppImageUpdate
      # can find the newest release through the .zsync file next to it) and
      # replaces electron-builder's old runtime with appimagetool's static one,
      # which doesn't need libfuse2 on the user's system. The update info names
      # the stable filename, so the versioned copy is the same file renamed.
      - name: Repack AppImage and add stable-named copies
        run: |
          mkdir -p stable work
          APPIMAGE=$(ls dist/*-x86_64.AppImage)
          curl -fsSL -o work/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x work/appimagetool "$APPIMAGE"
          (cd work && "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null)
          # Some unpacked node_modules dirs come out 0700; appimagetool refuses
          # those, since users other than the packager couldn't read them.
          chmod -R a+rX work/squashfs-root
          (cd stable && ARCH=x86_64 ../work/appimagetool --appimage-extract-and-run \
            -u "gh-releases-zsync|BrayLaf|VitaThemeCreator|latest|vita-theme-creator-x86_64.AppImage.zsync" \
            ../work/squashfs-root vita-theme-creator-x86_64.AppImage)
          cp stable/vita-theme-creator-x86_64.AppImage "$APPIMAGE"
          cp dist/*-amd64.deb stable/vita-theme-creator-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
            stable/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes ""
          gh release upload "$TAG" dist/*.AppImage dist/*.deb stable/* --clobber
